[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "siteline"
version = "0.1.0"
description = "Score metro-Atlanta sites against Georgia's 2024-2025 LIHTC QAP (SiteLine StartUp pack)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0,<3", "shapely>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "matplotlib>=3.7"]

# The package reads ../data relative to itself, so install it editable from the repo root:
#   pip install -e .        (or  pip install -e ".[geo]")
[tool.setuptools]
packages = ["siteline"]
